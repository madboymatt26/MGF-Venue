name: Publish WordPress release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build WordPress plugin archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd wp-plugin
          zip -r "../MGF-Venue-${version}.zip" mathlin-booking \
            -x "*/.DS_Store" "*/Thumbs.db"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "MGF-Venue-${version}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MGF Venue ${version}" \
            --generate-notes
