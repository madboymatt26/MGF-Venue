name: Integration CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/recurring-series-billing
      - feature/invoice-documents
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WP_VERSION: '6.6.2'
  WOO_VERSION: '9.3.3'
  MARIADB_VERSION: '10.11'

jobs:
  source-checks:
    name: Source checks / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run PHP lint and dependency-free programs
        run: sh tests/integration/run-php-suite.sh
      - name: Run invoice document unit tests
        run: php tests/php-invoice-document-unit.php
      - name: Render synthetic single-page and long invoices with Dompdf
        run: php tests/php-invoice-layout.php --render
      - name: Verify multi-area selector state transitions
        run: node tests/space-selection-ui.mjs
      - name: Verify calendar booking/viewing separation
        run: node tests/calendar-viewing-ui.mjs
      - name: Verify reusable extras picker state
        run: node tests/extras-picker-ui.mjs
      - name: Verify invoice modal keyboard and stale-response behaviour
        run: node tests/invoice-modal-ui.mjs
      - name: Run correctness regression tests
        run: php tests/php-correctness-regression.php
      - name: Verify pure heating policy and shared-demand guards
        run: |
          python -m pip install Jinja2==3.1.6
          python tests/python-heating-policy.py
          python tests/python-heating-coordinator.py
          python tests/python-heating-entities.py
          python tests/python-heating-wiring.py
          python tests/python-shared-demand.py
      - name: Validate Composer dependencies
        run: |
          cd wp-plugin/mathlin-booking
          composer validate --no-check-publish
          composer audit --locked
      - name: Check admin handler parity
        run: php mcp-server/tests/php-admin-parity-smoke.php
      - name: Validate MCP schemas
        shell: pwsh
        run: ./mcp-server/tests/mcp-tool-schema-smoke.ps1
      - name: Validate additional-charge MCP dispatch and PDF export
        shell: pwsh
        run: ./mcp-server/tests/additional-charge-dispatch-smoke.ps1
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Scan tracked files for committed credential formats
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!marketing/*.pdf'; then
            echo 'Potential committed credential detected.' >&2
            exit 1
          fi

  wordpress-runtime:
    name: WP ${{ matrix.wordpress }} / Woo ${{ matrix.woocommerce }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.6.2'
            woocommerce: '9.3.3'
            wordpress_image: 'wordpress:php7.4-apache'
            wpcli_image: 'wordpress:cli-php7.4'
          - php: '8.0'
            wordpress: '6.6.2'
            woocommerce: '9.3.3'
            wordpress_image: 'wordpress:php8.0-apache'
            wpcli_image: 'wordpress:cli-php8.0'
          - php: '8.2'
            wordpress: '6.6.2'
            woocommerce: '9.3.3'
            wordpress_image: 'wordpress:6.6.2-php8.2-apache'
            wpcli_image: 'wordpress:cli-2.11.0-php8.2'
          - php: '8.3'
            wordpress: '6.6.2'
            woocommerce: '9.3.3'
            wordpress_image: 'wordpress:6.6.2-php8.3-apache'
            wpcli_image: 'wordpress:cli-2.11.0-php8.3'
          # Pin these repository variables to the actual deployed versions.
          # The latest fallback also catches forward-compatibility regressions.
          - php: '8.3'
            wordpress: ${{ vars.MGF_PRODUCTION_WP_VERSION || 'latest' }}
            woocommerce: ${{ vars.MGF_PRODUCTION_WOO_VERSION || 'latest' }}
            wordpress_image: 'wordpress:php8.3-apache'
            wpcli_image: 'wordpress:cli-2.11.0-php8.3'
    env:
      WORDPRESS_IMAGE: ${{ matrix.wordpress_image }}
      WPCLI_IMAGE: ${{ matrix.wpcli_image }}
      MBS_TEST_WP_VERSION: ${{ matrix.wordpress }}
      MBS_TEST_WOO_VERSION: ${{ matrix.woocommerce }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore WP-CLI download cache
        uses: actions/cache@v4
        with:
          path: tests/integration/.cache/wp-cli
          key: wp-cli-woo-${{ matrix.woocommerce }}
      - name: Prepare disposable cache
        run: mkdir -p tests/integration/.cache/wp-cli && chmod 0777 tests/integration/.cache/wp-cli
      - name: Start MariaDB and WordPress
        run: docker compose -f tests/integration/docker-compose.yml up -d db wordpress
      - name: Install WordPress, WooCommerce, plugin, and test gateway
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli sh /workspace/tests/integration/setup.sh
      - name: Show exact runtime versions
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/runtime-smoke.php --allow-root
      - name: Additional charge financial isolation
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/additional-charges.php --allow-root
      - name: Charge UX and archive paging isolation
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/charge-ux-archive.php --allow-root
      - name: Browser acceptance for additional charges
        if: matrix.php == '8.2'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mgf-browser" playwright@1.55.1
          node "$RUNNER_TEMP/mgf-browser/node_modules/playwright/cli.js" install --with-deps chromium
          export MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs"
          export MGF_BROWSER_FIXTURE="$(docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp option get mbs_extra_browser_fixture --format=json --allow-root)"
          node tests/integration/charge-ux-archive-browser.mjs
          node tests/integration/additional-charges-browser.mjs
          node tests/integration/invoice-checkout-intent-browser.mjs
      - name: Upload browser acceptance screenshots
        if: always() && matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: additional-charge-browser
          path: browser-artifacts
          if-no-files-found: ignore
      - name: Verify invoice terms requests and real recurring billing journeys
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/invoice-terms-recurring.php --allow-root
      - name: Follow invoice terms request emails and staff review on mobile and desktop
        if: matrix.php == '8.2'
        run: MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" node tests/integration/invoice-terms-browser.mjs
      - name: Seed venue-mode browser fixture
        if: matrix.php == '8.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/venue-mode-browser-seed.php --allow-root
      - name: Verify venue mode shows billing, heating and the preview deadline on desktop and mobile
        if: matrix.php == '8.2'
        run: MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" node tests/integration/venue-mode-browser.mjs
      - name: Remove venue-mode browser fixture
        if: always() && matrix.php == '8.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/venue-mode-browser-cleanup.php --allow-root
      - name: Upload venue mode browser screenshots
        if: always() && matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: venue-mode-browser
          path: browser-artifacts/venue-*.png
          if-no-files-found: ignore
      - name: Verify Scout series administration lifecycle
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/scout-series-admin.php --allow-root
      - name: Verify staff booking preview and creation
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/admin-booking-entry.php --allow-root
      - name: Verify access payment policy and current-code outbox delivery
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/access-details.php --allow-root
      - name: Verify reviewed park consolidation and rollback
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/reviewed-park-consolidation.php --allow-root
      - name: Verify multi-area bookings and unchanged whole-venue dependencies
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/multi-space-bookings.php --allow-root
      - name: Verify legacy read-only guard cannot terminate WordPress recovery
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/legacy-read-only-recovery.php --allow-root
      - name: Verify cross-site identity, occupancy and feature-policy hardening
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/cross-site-hardening.php --allow-root
      - name: Verify complete exports, privacy pagination and durable delivery
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/review-reliability.php --allow-root
      - name: Verify invoice itemisation, payment snapshot and atomic HA rollback
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/invoice-layout-reliability.php --allow-root
      - name: Verify Scout heating metadata and outbox roll back atomically
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/scout-heating.php --allow-root
      - name: Verify existing admin change, revision and delivery intents roll back atomically
        if: matrix.php == '8.2'
        run: MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" node tests/integration/scout-heating-browser.mjs
      - name: Seed campsite-mode browser fixture
        if: matrix.php == '8.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/campsite-mode-browser-seed.php --allow-root
      - name: Verify campsite mode hides venue-only billing and heating on desktop and mobile
        if: matrix.php == '8.2'
        run: MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" node tests/integration/campsite-mode-browser.mjs
      - name: Restore venue mode after campsite browser acceptance
        if: always() && matrix.php == '8.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/campsite-mode-browser-cleanup.php --allow-root
      - name: Upload campsite mode browser screenshots
        if: always() && matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: campsite-mode-browser
          path: browser-artifacts/campsite-*.png
          if-no-files-found: ignore
      - name: Seed venue-mode browser fixture
        if: matrix.php == '8.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/venue-mode-browser-seed.php --allow-root
      - name: Verify venue mode shows billing, heating and the preview deadline on desktop and mobile
        if: matrix.php == '8.2'
        run: MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" node tests/integration/venue-mode-browser.mjs
      - name: Remove venue-mode browser fixture
        if: always() && matrix.php == '8.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/venue-mode-browser-cleanup.php --allow-root
      - name: Upload venue mode browser screenshots
        if: always() && matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: venue-mode-browser
          path: browser-artifacts/venue-*.png
          if-no-files-found: ignore
      - name: Verify existing booking-change atomicity
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/booking-change-atomicity.php --allow-root
      - name: Verify free-series approvals, cancellations and transport flags
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/series-outbox-atomicity.php --allow-root
      - name: Verify consistent export under a concurrent booking writer
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/export-snapshots.php --allow-root
      - name: Verify legacy Scout actions roll back complete batches
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/legacy-series-atomicity.php --allow-root
      - name: Verify bulk booking endpoint permissions and transitions
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/bulk-action-endpoint.php --allow-root
      - name: Verify archived bookings stay in financial-year revenue
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/archived-revenue.php --allow-root
      - name: Verify request rejection commits with a durable notification
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/request-rejection-atomicity.php --allow-root
      - name: Verify grouped navigation retains original WordPress routes and capabilities
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/admin-navigation.php --allow-root
      - name: Measure synthetic 300, 3000 and 20000 record query baseline
        if: matrix.php == '8.3' && matrix.wordpress == '6.6.2'
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/performance-baseline.php --allow-root
      - name: Verify optional extras catalogue and immutable charge snapshots
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/extras-catalogue.php --allow-root
      - name: Run invoice lifecycle matrix after hardening acceptance
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/invoice-lifecycle-matrix.php --allow-root
      - name: Verify explicit credit accounts, immutable invoices and cancellation/access isolation
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/credit-accounts.php --allow-root
      - name: Reject inactive payment writes without breaking explicit restore
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/inactive-payment-guard.php --allow-root
      - name: Verify invoice attention and guarded deposit journeys
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/admin-invoice-deposit-journeys.php --allow-root
      - name: Follow invoice review and deposit journeys on desktop and mobile
        if: matrix.php == '8.2'
        run: MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" node tests/integration/admin-invoice-deposit-browser.mjs
      - name: Upload invoice and deposit journey screenshots
        if: always() && matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: invoice-deposit-journeys
          path: browser-artifacts
          if-no-files-found: ignore
      - name: Collect service diagnostics
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml logs --no-color > integration-services.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.wordpress }}-${{ matrix.woocommerce }}-${{ matrix.php }}-diagnostics
          path: integration-services.log
          if-no-files-found: error
      - name: Stop disposable services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v --remove-orphans

  financial-integration:
    name: Real financial and concurrency integration
    runs-on: ubuntu-24.04
    env:
      WORDPRESS_IMAGE: wordpress:6.6.2-php8.2-apache
      WPCLI_IMAGE: wordpress:cli-2.11.0-php8.2
      MBS_TEST_WOO_VERSION: '9.3.3'
    steps:
      - uses: actions/checkout@v4
      - name: Restore WP-CLI download cache
        uses: actions/cache@v4
        with:
          path: tests/integration/.cache/wp-cli
          key: wp-cli-woo-9.3.3
      - name: Prepare disposable cache
        run: mkdir -p tests/integration/.cache/wp-cli && chmod 0777 tests/integration/.cache/wp-cli
      - name: Start MariaDB and WordPress
        run: docker compose -f tests/integration/docker-compose.yml up -d db wordpress
      - name: Install the real runtime
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli sh /workspace/tests/integration/setup.sh
      - name: Run separate-process integration scenarios
        run: sh tests/integration/run-concurrency.sh
      - name: Prepare trusted loopback HTTPS for authenticated MCP
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/mgf-ci.key -out /tmp/mgf-ci.crt -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          sudo cp /tmp/mgf-ci.crt /usr/local/share/ca-certificates/mgf-ci.crt
          sudo update-ca-certificates
          sudo python3 tests/integration/tls-proxy.py --cert /tmp/mgf-ci.crt --key /tmp/mgf-ci.key > /tmp/mgf-tls-proxy.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail https://localhost/wp-json/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run authenticated MCP mutation protection against WordPress
        shell: bash
        run: |
          set -euo pipefail
          app_password="$(docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp user application-password create admin 'MGF integration CI' --porcelain --allow-root)"
          MGF_VENUE_BASE_URL='https://localhost' MGF_VENUE_USERNAME='admin' MGF_VENUE_APP_PASSWORD="$app_password" pwsh -NoLogo -NoProfile -File mcp-server/tests/mcp-live-mutation.ps1
      - name: Collect service and worker diagnostics
        if: always()
        shell: bash
        run: |
          docker compose -f tests/integration/docker-compose.yml logs --no-color > integration-services.log
          for file in tests/integration/.worker-* tests/integration/.exit-*; do
            if [[ -f "$file" ]]; then cp "$file" "$(basename "$file").log"; fi
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-integration-diagnostics
          path: |
            integration-services.log
            .worker-*.log
            .exit-*.log
          if-no-files-found: error
      - name: Stop disposable services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v --remove-orphans

  calendar-subscription:
    name: Public calendar HTTP and subscription browser
    runs-on: ubuntu-24.04
    env:
      WORDPRESS_IMAGE: wordpress:6.6.2-php8.2-apache
      WPCLI_IMAGE: wordpress:cli-2.11.0-php8.2
      MBS_TEST_WOO_VERSION: '9.3.3'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable cache
        run: mkdir -p tests/integration/.cache/wp-cli && chmod 0777 tests/integration/.cache/wp-cli
      - name: Start isolated WordPress and MariaDB
        run: docker compose -f tests/integration/docker-compose.yml up -d db wordpress
      - name: Install runtime and synthetic calendar fixtures
        run: |
          docker compose -f tests/integration/docker-compose.yml run --rm -T cli sh /workspace/tests/integration/setup.sh
          docker compose -f tests/integration/docker-compose.yml run --rm -T cli wp eval-file /workspace/tests/integration/scenarios/calendar-subscription.php --allow-root
      - name: Verify real HTTP, ICS parser and desktop/mobile subscription
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mgf-browser" playwright@1.55.1 ical.js@2.2.1
          node "$RUNNER_TEMP/mgf-browser/node_modules/playwright/cli.js" install --with-deps chromium
          MGF_BROWSER_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright/index.mjs" MGF_ICAL_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/ical.js/dist/ical.js" node tests/integration/calendar-subscription-browser.mjs
      - name: Upload calendar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-subscription
          path: browser-artifacts/calendar-*.png
          if-no-files-found: ignore
      - name: Stop disposable services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v --remove-orphans

  booking-review-layout:
    name: Booking review mobile layout and money journeys
    runs-on: ubuntu-24.04
    env:
      WORDPRESS_IMAGE: wordpress:6.6.2-php8.2-apache
      WPCLI_IMAGE: wordpress:cli-2.11.0-php8.2
      MBS_TEST_WOO_VERSION: '9.3.3'
      MBS_TEST_URL: http://localhost:8088
      MBS_TEST_PASSWORD: Synthetic-expiry-browser-2026!
      MBS_TEST_READER_PASSWORD: Synthetic-reader-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated WordPress and MariaDB
        run: docker compose -f tests/integration/docker-compose.yml up -d db wordpress
      - name: Install disposable runtime
        run: docker compose -f tests/integration/docker-compose.yml run --rm -T cli sh /workspace/tests/integration/setup.sh
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/mgf-browser" playwright@1.55.1
          node "$RUNNER_TEMP/mgf-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test rendered layout, keyboard minimisation and complete money journeys
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/mgf-browser/node_modules/playwright"
          seed() {
            docker compose -f tests/integration/docker-compose.yml run --rm -T -e MBS_DISPOSABLE_BROWSER=1 cli wp eval-file /workspace/tests/integration/scenarios/payment-expiry-browser-seed.php --allow-root
          }
          seed
          node tests/booking-review-layout-browser.cjs
          for width in 1280 390; do
            seed
            MBS_TEST_WIDTH="$width" node tests/payment-expiry-browser.cjs
          done
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-review-layout
          path: browser-artifacts/booking-*.png
          if-no-files-found: error
      - name: Stop disposable services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v --remove-orphans
